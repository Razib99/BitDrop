[package]
name = "rust_lib_bitdrop"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
crossbeam-channel = "0.5.17"
flutter_rust_bridge = "=2.0.0"
lazy_static = "1.5.1"

symphonia = { version = "0.5.3", features = ["all"] }


tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
byteorder = "1.5"
anyhow = "1.0"

rusqlite = { version = "0.31", features = ["bundled"] }
rubato = "5.0.1"
rtrb = "0.3"
parking_lot = "0.12"
futures-util = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
# shared-stdcxx: link libc++ dynamically. The default static link drops
# libc++abi symbols such as __cxa_pure_virtual, and the library then
# fails to dlopen at runtime. android/app/src/main/jniLibs ships the
# matching libc++_shared.so for each ABI.
oboe = { version = "0.6.1", features = ["shared-stdcxx"] }


[target.'cfg(not(target_os = "android"))'.dependencies]
cpal = "0.15"


