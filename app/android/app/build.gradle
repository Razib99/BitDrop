plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.bitdrop.bitdrop"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.bitdrop.bitdrop"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword = keystoreProperties['storePassword']
            } else if (System.getenv('ANDROID_KEYSTORE_PATH') != null) {
                keyAlias = System.getenv('ANDROID_KEY_ALIAS')
                keyPassword = System.getenv('ANDROID_KEY_PASSWORD')
                storeFile = file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword = System.getenv('ANDROID_STORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig = (keystorePropertiesFile.exists() || System.getenv('ANDROID_KEYSTORE_PATH') != null)
                ? signingConfigs.release
                : signingConfigs.debug
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "BitDrop-v${variant.versionName}.apk"
        }
        variant.assembleProvider.configure {
            doLast {
                copy {
                    from layout.buildDirectory.dir("outputs/apk/${variant.name}")
                    into layout.buildDirectory.dir("outputs/flutter-apk")
                    include "BitDrop-v*.apk"
                }
            }
        }
    }
}

flutter {
    source = "../.."
}
