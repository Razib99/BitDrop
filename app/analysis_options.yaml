include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "lib/l10n/app_localizations*.dart"
    # flutter_rust_bridge output: regenerated on every build,
    # so any fix applied here is undone by the next codegen.
    - "lib/src/rust/**"

linter:
  rules:
    - prefer_single_quotes
    - avoid_print
    - unawaited_futures
