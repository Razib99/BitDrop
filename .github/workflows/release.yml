name: BitDrop v1.0 Production Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  verify:
    name: Verification Gates & Quality Sign-Off
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Audio Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rustfmt Check
        run: cargo fmt --check --manifest-path app/rust/Cargo.toml

      - name: Clippy Linter (-D warnings)
        run: cargo clippy --manifest-path app/rust/Cargo.toml --all-targets -- -D warnings

      - name: Run Unit & Integration Tests (152 tests)
        run: cargo test --manifest-path app/rust/Cargo.toml

      - name: Run Golden Audio Suite
        run: cargo test --manifest-path app/rust/Cargo.toml --test golden_audio_suite -- --nocapture

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Native Library for Flutter Tests
        run: cargo build --manifest-path app/rust/Cargo.toml

      - name: Flutter Static Analysis
        working-directory: app
        run: flutter analyze --no-fatal-infos lib test

      - name: Flutter Test Suite (230 tests)
        working-directory: app
        run: flutter test

  build-release-artifacts:
    name: Build Android Release Packages (APK & AAB)
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Rust Stable with Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Install Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Universal Release APK
        working-directory: app
        run: flutter build apk --release

      - name: Build Split-per-ABI Release APKs
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Build Release App Bundle (AAB)
        working-directory: app
        run: flutter build appbundle --release

      - name: Prepare Release Artifacts Directory
        run: |
          mkdir -p release_assets
          cp app/build/app/outputs/flutter-apk/app-release.apk release_assets/BitDrop-v1.0.0-universal.apk
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_assets/BitDrop-v1.0.0-arm64-v8a.apk || true
          cp app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_assets/BitDrop-v1.0.0-armeabi-v7a.apk || true
          cp app/build/app/outputs/flutter-apk/app-x86_64-release.apk release_assets/BitDrop-v1.0.0-x86_64.apk || true
          cp app/build/app/outputs/bundle/release/app-release.aab release_assets/BitDrop-v1.0.0.aab || true
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: BitDrop-Production-Binaries
          path: release_assets/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: BitDrop ${{ github.ref_name || inputs.tag_name }}
          body_path: CHANGELOG.md
          files: release_assets/*
          draft: false
          prerelease: false
